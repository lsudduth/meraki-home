name: Terraform Apply (Main Branch)

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'variables.tf'
      - 'main.tf'
      - 'backend.tf'
      - '.github/workflows/terraform-apply.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_VAR_meraki_api_key: ${{ secrets.MERAKIAPIKEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.S3_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -auto-approve tfplan 2>&1 | tee apply_output.txt

      - name: Post Apply Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Terraform apply completed successfully\n\nState updated in S3: `s3://${{ secrets.S3_BUCKET }}/meraki-home/terraform.tfstate`'
            });

      - name: Post Apply Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('apply_output.txt', 'utf8').substring(0, 500);
            } catch (e) {
              output = 'Apply output not available';
            }

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Terraform apply failed\n\n```\n' + output + '\n```\n\nCheck the GitHub Actions logs for details.'
            });

      - name: Upload Apply Log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: apply-log
          path: apply_output.txt
          retention-days: 7
